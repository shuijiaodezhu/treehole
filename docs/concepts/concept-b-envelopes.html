<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>概念 B · 信封墙</title>
<style>
  :root{
    --paper:#f4ebdd; --ink:#3a2f26; --muted:#8a7a68; --line:#ddd0b8;
    --wax:#a8563a; --honey:#d99a4e; --cocoa:#5a4034;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
       font-family:"Songti SC","Noto Serif SC",Georgia,serif;}
  a{color:inherit;text-decoration:none}
</style>
</head>
<body>

<div style="position:relative;min-height:100vh;overflow:hidden;background:
     radial-gradient(120% 90% at 78% 12%, #f8f0e3 0%, var(--paper) 60%)">

  <!-- 四个信封：大小差得很夸张、互相压着、有的被屏幕裁掉 -->
  <a href="#" style="position:absolute;left:-4vw;top:12vh;width:52vw;height:34vw;
      background:#fdf8f0;border:1.5px solid var(--line);border-radius:14px;
      transform:rotate(-4deg);box-shadow:0 26px 60px -30px rgba(90,64,52,.45)">
    <span style="position:absolute;left:6%;bottom:8%;font-size:min(4.4vw,46px)">小屋</span>
    <span style="position:absolute;left:6%;bottom:4%;font-size:min(1.5vw,15px);color:var(--muted)">
      11 封未读
    </span>
    <svg viewBox="0 0 100 60" preserveAspectRatio="none"
         style="position:absolute;inset:0;width:100%;height:100%">
      <path d="M0 0 L50 42 L100 0" fill="none" stroke="var(--line)" stroke-width="1.2"/>
    </svg>
  </a>

  <a href="#" style="position:absolute;right:-6vw;top:6vh;width:44vw;height:29vw;
      background:#f8efe0;border:1.5px solid var(--line);border-radius:14px;
      transform:rotate(3.4deg);box-shadow:0 26px 60px -30px rgba(90,64,52,.4)">
    <span style="position:absolute;right:8%;bottom:10%;font-size:min(3.8vw,40px)">院子</span>
    <span style="position:absolute;right:8%;bottom:5%;font-size:min(1.4vw,14px);color:var(--muted)">
      今晚 3 个人在说梦
    </span>
    <svg viewBox="0 0 100 60" preserveAspectRatio="none"
         style="position:absolute;inset:0;width:100%;height:100%">
      <path d="M0 0 L50 42 L100 0" fill="none" stroke="var(--line)" stroke-width="1.2"/>
    </svg>
  </a>

  <a href="#" style="position:absolute;left:16vw;bottom:-7vh;width:38vw;height:25vw;
      background:#fbeae3;border:1.5px solid #eccfbf;border-radius:14px;
      transform:rotate(1.6deg);box-shadow:0 26px 60px -30px rgba(168,86,58,.45)">
    <span style="position:absolute;left:8%;top:12%;font-size:min(3.4vw,36px)">聚会</span>
    <span style="position:absolute;left:8%;top:32%;font-size:min(1.4vw,14px);color:#9c7566">
      有人在放一首很旧的歌
    </span>
    <svg viewBox="0 0 100 60" preserveAspectRatio="none"
         style="position:absolute;inset:0;width:100%;height:100%">
      <path d="M0 0 L50 42 L100 0" fill="none" stroke="#eccfbf" stroke-width="1.2"/>
    </svg>
  </a>

  <a href="#" style="position:absolute;right:12vw;bottom:6vh;width:24vw;height:16vw;
      background:#f1e9df;border:1.5px solid var(--line);border-radius:12px;
      transform:rotate(-2.2deg);box-shadow:0 22px 50px -28px rgba(90,64,52,.4)">
    <span style="position:absolute;right:9%;top:16%;font-size:min(2.4vw,26px)">我的</span>
    <span style="position:absolute;right:9%;top:44%;font-size:min(1.2vw,13px);color:var(--muted)">
      收着 27 封信
    </span>
  </a>

  <!-- 一句真话压在正中偏下，是这一页唯一的"文字内容" -->
  <p style="position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);
            font-size:min(2.4vw,26px);color:var(--ink);white-space:nowrap">
    「今天有星星吗。」
  </p>
</div>

</body>
</html>
