<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>概念 D3 · 桌面</title>
<style>
  :root{--paper:#f1e7d8;--ink:#3a2f26;--muted:#8a7a68;--line:#ddd0b8;
        --wax:#a8563a;--honey:#d99a4e;--cocoa:#5a4034}
  *
  body{color:var(--ink);overflow-x:hidden;font-family:"Songti SC","Noto Serif SC",Georgia,serif;
       background:radial-gradient(120% 80% at 18% 0%,#f7efe2 0%,var(--paper) 55%,#e8dac4 100%)}
  a
  .brush
  .card
</style>
</head>
<body>
<div style="position:relative;min-height:104vh;padding-bottom:18vh">

  <!-- ═══ 主信纸（标题 = 信头）═══ -->
  <div class="card" style="position:absolute;left:5vw;top:7vh;width:min(600px,76vw);
              background:#fdf9f2;padding:42px 50px 56px;transform:rotate(-2.2deg)">
    <h1 class="brush" style="font-size:min(6.2vw,45px);line-height:1.05;letter-spacing:.03em">你的来信</h1>
    <p style="margin-top:9px;font-size:12px;letter-spacing:.18em;color:var(--muted)">
      DEAR YOU · 十月十六日，夜里</p>
    <div style="margin-top:24px;height:1px;background:var(--line)"></div>
    <p style="margin-top:28px;font-size:min(3.05vw,25px);line-height:1.95">
      今天有星星吗。<br>我在院子里抬头看了会儿，想起你上次说，<br>冬天的星星比夏天锐利。</p>
    <div style="position:absolute;right:42px;bottom:-21px;width:58px;height:58px;border-radius:999px;
                background:radial-gradient(circle at 34% 30%,#c2674a,var(--wax));
                box-shadow:0 10px 22px -10px rgba(120,50,30,.6);
                display:flex;align-items:center;justify-content:center">
      <span class="brush" style="color:#fdf8f0;font-size:21px;line-height:1">来</span></div>
  </div>

  <!-- ═══ 照片：里面就是那个信箱（直接用仓库里的插画）═══ -->
  <a href="#" class="card" style="position:absolute;right:5vw;top:11vh;width:min(320px,40vw);
      background:#fff;padding:12px 12px 52px;transform:rotate(3.6deg)">
    <div style="background:#f8f0e4;border-radius:3px;padding:4px 6px 0"><svg style="width:100%;height:auto"
        viewBox="0 0 215 255"
        aria-hidden="true"
      >
        
        <g fill="#d99a4e" opacity="0.45">
          <circle cx="34" cy="26" r="2.4" />
          <circle cx="84" cy="14" r="2" />
          <circle cx="158" cy="36" r="2.2" />
          <circle cx="196" cy="104" r="2" />
          <circle cx="12" cy="116" r="2.2" />
          <circle cx="54" cy="150" r="1.8" />
        </g>

        
        <path d="M0 226 C 34 218, 68 222, 100 225 C 134 228, 170 220, 215 224 L215 255 L0 255 Z" fill="#f2d3c6" />
        <path
          d="M0 226 C 34 218, 68 222, 100 225 C 134 228, 170 220, 215 224"
          fill="none"
          stroke="#e0d3bd"
          stroke-width="1.6"
        />

        
        <path
          d="M78 168 H96 L93 236 H81 Z"
          fill="#f2d3c6"
          stroke="#e0d3bd"
          stroke-width="2.2"
          stroke-linejoin="round"
        />
        <path d="M88 168 H96 L93 236 H88 Z" fill="#e0d3bd" />
        
        <ellipse cx="89" cy="227" rx="25" ry="7" fill="#e0d3bd" opacity="0.75" />

        
        <path d="M40 120 A45 45 0 0 1 130 120 L156 107 A45 45 0 0 0 66 107 Z" fill="#d99a4e" />

        
        <path
          d="M130 120 L156 107 L156 150 L130 163 Z"
          fill="#c4705a"
          fillOpacity="0.55"
          stroke="#c4705a"
          stroke-width="2.2"
          stroke-linejoin="round"
        />

        
        <path
          d="M40 120 A45 45 0 0 1 130 120 L130 163 L48 163 L40 152 Z"
          fill="#f2d3c6"
          stroke="#c4705a"
          stroke-width="2.6"
          stroke-linejoin="round"
        />

        
        <rect
          x="48"
          y="124"
          width="60"
          height="34"
          rx="3"
          fill="#e0d3bd"
          fillOpacity="0.55"
          stroke="#e0d3bd"
          stroke-width="2"
        />

        
        <path d="M52 127 H88 V155 H52 Z" fill="#d99a4e" fillOpacity="0.5" />
        <g stroke="#f2d3c6" stroke-width="2" stroke-linecap="round">
          <path d="M56 132 H61" />
          <path d="M65 139 H70" />
          <path d="M74 146 H79" />
        </g>
        <path
          d="M58 134 L79 138 L75 155 L54 151 Z"
          fill="#f2d3c6"
          stroke="#d99a4e"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <g stroke="#d99a4e" stroke-width="1.5" stroke-linecap="round">
          <path d="M61 141 L72 143" />
          <path d="M60 147 L69 149" />
        </g>

        
        <circle cx="100" cy="140" r="3" fill="#c4705a" />

        
        <path d="M146 150 V98" stroke="#c4705a" stroke-width="2.6" stroke-linecap="round" />
        <path d="M146 98 L170 104 L170 116 L146 110 Z" fill="#c4705a" />

        
        <path
          d="M66 107 A45 45 0 0 1 156 107"
          fill="none"
          stroke="#f2d3c6"
          stroke-width="6"
          stroke-linecap="round"
        />

        
        <path
          d="M9 84 A6.5 6.5 0 0 1 22 84 A6.5 6.5 0 0 1 35 84 L22 98.6 Z"
          fill="#c4705a"
          fillOpacity="0.75"
        />

        
        <path d="M0 240 C 40 233, 82 238, 122 241 C 160 244, 188 237, 215 240 L215 255 L0 255 Z" fill="#f2d3c6" />
        <path
          d="M0 240 C 40 233, 82 238, 122 241 C 160 244, 188 237, 215 240"
          fill="none"
          stroke="#e0d3bd"
          stroke-width="1.6"
        />
        
        <path d="M150 240 C 156 232, 172 232, 180 240" fill="none" stroke="#e0d3bd" stroke-width="1.4" />
        <path d="M24 243 C 30 236, 44 236, 52 243" fill="none" stroke="#e0d3bd" stroke-width="1.4" />

        
        <g fill="#d99a4e" opacity="0.75">
          <circle cx="20" cy="58" r="6.8" />
          <circle cx="188" cy="150" r="5.6" />
          <circle cx="26" cy="196" r="5.2" />
          <circle cx="174" cy="208" r="5.6" />
        </g>
      </svg></div>
    <p style="position:absolute;left:15px;bottom:17px;font-size:15px">院子</p>
    <p style="position:absolute;right:15px;bottom:18px;font-size:12.5px;color:var(--muted)">今晚 3 个人在说梦</p>
    <!-- 胶带：把照片"贴"在桌上 -->
    <div style="position:absolute;left:38%;top:-11px;width:74px;height:22px;
                background:rgba(240,228,208,.85);border:1px solid rgba(200,180,150,.5);
                transform:rotate(-3deg)"></div>
  </a>

  <!-- ═══ 一、信封（小屋）═══ -->
  <a href="#" class="card" style="position:absolute;left:15vw;bottom:16vh;width:min(420px,58vw);
      background:#f8eee2;border:1.5px solid #e3d4bd;padding:42px 34px 30px;
      transform:rotate(5deg)">
    <!-- 封盖：折线 + 淡淡的暗面 -->
    <svg viewBox="0 0 100 30" preserveAspectRatio="none"
         style="position:absolute;left:0;right:0;top:0;width:100%;height:30px">
      <path d="M0 0 L50 27 L100 0 Z" fill="rgba(226,211,189,.55)"/>
      <path d="M0 0 L50 27 L100 0" fill="none" stroke="#dcc9ae" stroke-width="1.4"/>
    </svg>
    <!-- 邮票 -->
    <div style="position:absolute;right:15px;top:13px;width:50px;height:60px;background:#fff;
                border:1.4px dashed #d9c3ae;padding:5px">
      <div style="height:32px;background:linear-gradient(150deg,#e9d3c1,#d9b79c)"></div>
      <div style="margin-top:4px;font-size:8px;letter-spacing:.1em;color:var(--muted);text-align:center">80¢</div>
    </div>
    <!-- 手写地址感 -->
    <p style="font-size:min(2.6vw,22px)">小屋</p>
    <p style="margin-top:8px;font-size:13.5px;color:var(--muted);max-width:72%">
      那几个人还在等你回话 · 未读 11 封</p>
    <div style="margin-top:14px;height:1px;width:64%;background:repeating-linear-gradient(90deg,#e0cdb4 0 8px,transparent 8px 13px)"></div>
  </a>

  <!-- ═══ 二、票根（聚会）═══ -->
  <a href="#" style="position:absolute;right:17vw;bottom:26vh;width:min(250px,33vw);
      background:#fbeae3;border:1.4px solid #e6c3ae;padding:19px 22px;transform:rotate(-7deg);
      box-shadow:0 22px 50px -30px rgba(168,86,58,.5)">
    <!-- 两侧齿孔缺口 -->
    <div style="position:absolute;left:-8px;top:50%;width:15px;height:15px;border-radius:999px;
                background:var(--paper);transform:translateY(-50%)"></div>
    <div style="position:absolute;right:-8px;top:50%;width:15px;height:15px;border-radius:999px;
                background:var(--paper);transform:translateY(-50%)"></div>
    <p style="font-size:9.5px;letter-spacing:.2em;color:#a98a78">NO. 0031 · ADMIT ONE</p>
    <p style="margin-top:7px;font-size:min(2.05vw,19px)">聚会</p>
    <p style="margin-top:5px;font-size:12.5px;color:#9c7566">有人在放一首很旧的歌</p>
    <div style="margin-top:12px;border-top:1px dashed #e6c3ae"></div>
  </a>

  <!-- ═══ 三、本子（我的）═══ -->
  <a href="#" class="card" style="position:absolute;right:7vw;bottom:15vh;width:min(180px,25vw);
      background:#e7d8c0;border:1.5px solid #d3bfa0;border-radius:7px;
      padding:24px 18px 24px 30px;transform:rotate(9deg)">
    <!-- 书脊 -->
    <div style="position:absolute;left:14px;top:0;bottom:0;width:2px;
                background:linear-gradient(180deg,#cdb795,#dcc9ae)"></div>
    <!-- 松紧带 -->
    <div style="position:absolute;right:20px;top:0;bottom:0;width:3px;background:#b28a63;opacity:.55"></div>
    <!-- 书签带 -->
    <div style="position:absolute;right:30px;top:-10px;width:11px;height:42px;
                background:var(--wax);border-radius:1px 1px 2px 2px"></div>
    <!-- 页口：几道细线 -->
    <div style="position:absolute;right:-4px;top:12px;bottom:12px;width:4px;
                background:repeating-linear-gradient(180deg,#fdf9f2 0 2px,#e0d3bd 2px 3px);border-radius:2px"></div>
    <p style="font-size:min(1.85vw,17px)">我的</p>
    <p style="margin-top:5px;font-size:11.5px;color:var(--muted)">收着 27 封信</p>
  </a>

  <!-- ═══ 页脚：隐私文件 + 断开的线（两段，各在字上方）═══ -->
  <footer style="position:absolute;left:5vw;right:5vw;bottom:5vh;display:flex;
                 align-items:flex-end;gap:34px;font-size:12px;color:var(--muted)">
    <nav style="display:flex;gap:26px;border-top:1px solid var(--line);padding-top:15px">
      <a href="#">社区公约</a><a href="#">举报与申诉</a><a href="#">隐私政策</a>
      <a href="#">用户协议</a><a href="#">关于</a>
    </nav>
    <a href="#" style="margin-left:auto;border-top:1px solid var(--line);padding-top:15px">全部条款 →</a>
  </footer>
</div>
</body>
</html>
