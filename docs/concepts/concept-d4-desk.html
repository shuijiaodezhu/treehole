<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>概念 D4 · 桌面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f1e7d8;--ink:#3a2f26;--muted:#8a7a68;--line:#ddd0b8;
        --wax:#a8563a;--honey:#d99a4e;--cocoa:#5a4034}
  *{box-sizing:border-box;margin:0;padding:0}
  body{color:var(--ink);overflow-x:hidden;font-family:"Songti SC","Noto Serif SC",Georgia,serif;
       background:radial-gradient(120% 80% at 18% 0%,#f7efe2 0%,var(--paper) 55%,#e8dac4 100%)}
  a{color:inherit;text-decoration:none}
  .brush{font-family:"Ma Shan Zheng","Songti SC",serif}
  .lift{box-shadow:0 32px 76px -38px rgba(90,64,52,.55)}
</style>
</head>
<body>
<div style="position:relative;min-height:106vh;padding-bottom:16vh">

  <!-- ═══ 右上：功能区（不能丢）═══ -->
  <div style="position:absolute;right:4vw;top:3.4vh;display:flex;align-items:center;gap:14px;
              font-size:12.5px;color:var(--muted)">
    <span>3362419236@qq.com</span>
    <a href="#" title="通知" style="display:inline-flex;width:30px;height:30px;border-radius:999px;
       border:1px solid var(--line);align-items:center;justify-content:center">🔔</a>
    <a href="#" title="搜索" style="display:inline-flex;width:30px;height:30px;border-radius:999px;
       border:1px solid var(--line);align-items:center;justify-content:center">🔍</a>
    <a href="#">退出登录</a>
  </div>

  <!-- ═══ 主信纸（标题＝信头；文字区不再被压）═══ -->
  <div class="lift" style="position:absolute;left:5vw;top:11vh;width:min(560px,60vw);
              background:#fdf9f2;padding:40px 46px 52px;transform:rotate(-2.2deg)">
    <h1 class="brush" style="font-size:min(6vw,44px);line-height:1.05;letter-spacing:.03em">你的来信</h1>
    <p style="margin-top:9px;font-size:11.5px;letter-spacing:.18em;color:var(--muted)">
      DEAR YOU · 十月十六日，夜里</p>
    <div style="margin-top:22px;height:1px;background:var(--line)"></div>

    <p style="margin-top:26px;font-size:min(2.9vw,24px);line-height:1.9">
      今天有星星吗。<br>我在院子里抬头看了会儿，想起你上次说，<br>冬天的星星比夏天锐利。</p>

    <!-- ⑤ 天气 + 短建议（就在引言下面）-->
    <p style="margin-top:26px;font-size:13px;color:#6f5d4c">
      徐州市 · 阴 <span style="color:var(--ink)">17°</span>
      <span style="color:var(--muted)">/ 15°</span>
      <span style="margin-left:10px;color:#8a6a4a">今天温度刚好，出去走走吧。</span>
    </p>

    <!-- ⑥ 连续陪伴（换掉"三个人在说梦"）-->
    <p style="margin-top:10px;font-size:12px;letter-spacing:.1em;color:var(--muted)">
      陪你走过 3 天 · 今天是重逢的第一天
    </p>

    <div style="position:absolute;right:40px;bottom:-20px;width:56px;height:56px;border-radius:999px;
                background:radial-gradient(circle at 34% 30%,#c2674a,var(--wax));
                box-shadow:0 10px 22px -10px rgba(120,50,30,.6);
                display:flex;align-items:center;justify-content:center">
      <span class="brush" style="color:#fdf8f0;font-size:20px;line-height:1">来</span></div>
  </div>

  <!-- ═══ 照片＝冬日信箱（真的那张插画；点它开信箱）═══ -->
  <a href="#" class="lift" style="position:absolute;right:4.5vw;top:12vh;width:min(300px,32vw);
      background:#fff;padding:11px 11px 24px;transform:rotate(3.4deg)">
    <div style="background:#f8f0e4;border-radius:3px;padding:2px 4px 0"><svg style="width:100%;height:auto;display:block"
        viewBox="0 0 215 255"
        aria-hidden="true"
      >
        
        <g fill="#d99a4e" opacity="0.45">
          <circle cx="34" cy="26" r="2.4" />
          <circle cx="84" cy="14" r="2" />
          <circle cx="158" cy="36" r="2.2" />

          <circle cx="12" cy="116" r="2.2" />
          <circle cx="54" cy="150" r="1.8" />

        <rect

        <circle cx="100" cy="140" r="3" fill="#c4705a" />

        <path d="M146 98 L170 104 L170 116 L146 110 Z" fill="#c4705a" />

        
        <path
          d="M66 107 A45 45 0 0 1 156 107"

        <path
          d="M9 84 A6.5 6.5 0 0 1 22 84 A6.5 6.5 0 0 1 35 84 L22 98.6 Z"
          fill="#c4705a"
          fillOpacity="0.75"
        />

        
        <path d="M0 240 C 40 233, 82 238, 122 241 C 160 244, 188 237, 215 240 L215 255 L0 255 Z" fill="#f2d3c6" />
        <path
          d="M0 240 C 40 233, 82 238, 122 241 C 160 244, 188 237, 215 240"
          fill="none"
          stroke="#e0d3bd"
          strokeWidth="1.6"
        />
        
        <path d="M150 240 C 156 232, 172 232, 180 240" fill="none" stroke="#e0d3bd" strokeWidth="1.4" />

        <g fill="#d99a4e" opacity="0.75">
          <circle cx="20" cy="58" r="6.8" />

          <circle cx="26" cy="196" r="5.2" />
          <circle cx="174" cy="208" r="5.6" />
        </g>
      </svg></div>
    <p style="position:absolute;left:14px;bottom:5px;font-size:13.5px">冬日信箱</p>
    <p style="position:absolute;right:14px;bottom:6px;font-size:11.5px;color:var(--muted)">点它写信</p>
    <div style="position:absolute;left:40%;top:-10px;width:70px;height:20px;
                background:rgba(240,228,208,.85);border:1px solid rgba(200,180,150,.5);transform:rotate(-3deg)"></div>
  </a>

  <!-- ═══ 信封（小屋）═══ -->
  <a href="#" class="lift" style="position:absolute;left:13vw;bottom:14vh;width:min(400px,54vw);
      background:#f8eee2;border:1.5px solid #e3d4bd;padding:40px 32px 28px;transform:rotate(5deg)">
    <svg viewBox="0 0 100 30" preserveAspectRatio="none"
         style="position:absolute;left:0;right:0;top:0;width:100%;height:30px">
      <path d="M0 0 L50 27 L100 0 Z" fill="rgba(226,211,189,.55)"/>
      <path d="M0 0 L50 27 L100 0" fill="none" stroke="#dcc9ae" stroke-width="1.4"/></svg>
    <div style="position:absolute;right:14px;top:12px;width:48px;height:58px;background:#fff;
                border:1.4px dashed #d9c3ae;padding:5px">
      <div style="height:31px;background:linear-gradient(150deg,#e9d3c1,#d9b79c)"></div>
      <div style="margin-top:4px;font-size:7.5px;letter-spacing:.1em;color:var(--muted);text-align:center">80¢</div>
    </div>
    <p style="font-size:min(2.5vw,21px)">小屋</p>
    <p style="margin-top:7px;font-size:13px;color:var(--muted);max-width:72%">
      那几个人还在等你回话 · 未读 11 封</p>
    <div style="margin-top:12px;height:1px;width:62%;background:repeating-linear-gradient(90deg,#e0cdb4 0 8px,transparent 8px 13px)"></div>
  </a>

  <!-- ═══ 票根（聚会）═══ -->
  <a href="#" style="position:absolute;right:16vw;bottom:27vh;width:min(240px,32vw);
      background:#fbeae3;border:1.4px solid #e6c3ae;padding:18px 21px;transform:rotate(-7deg);
      box-shadow:0 22px 50px -30px rgba(168,86,58,.5)">
    <div style="position:absolute;left:-8px;top:50%;width:15px;height:15px;border-radius:999px;
                background:var(--paper);transform:translateY(-50%)"></div>
    <div style="position:absolute;right:-8px;top:50%;width:15px;height:15px;border-radius:999px;
                background:var(--paper);transform:translateY(-50%)"></div>
    <p style="font-size:9px;letter-spacing:.2em;color:#a98a78">NO. 0031 · ADMIT ONE</p>
    <p style="margin-top:6px;font-size:min(2vw,18px)">聚会</p>
    <p style="margin-top:4px;font-size:12px;color:#9c7566">有人在放一首很旧的歌</p>
    <div style="margin-top:11px;border-top:1px dashed #e6c3ae"></div>
  </a>

  <!-- ═══ 本子（我的，重做）═══ -->
  <a href="#" class="lift" style="position:absolute;right:6vw;bottom:13vh;width:min(176px,25vw);
      background:linear-gradient(155deg,#dfcdb2,#cdb795);border:1px solid #c3ab86;border-radius:9px;
      padding:26px 16px 26px 28px;transform:rotate(8deg)">
    <div style="position:absolute;left:13px;top:8px;bottom:8px;width:2px;
                background:linear-gradient(180deg,#b79a72,#d8c4a4)"></div>
    <div style="position:absolute;right:18px;top:0;bottom:0;width:3px;background:#a87f56;opacity:.5"></div>
    <div style="position:absolute;right:28px;top:-9px;width:10px;height:40px;
                background:var(--wax);border-radius:1px 1px 2px 2px"></div>
    <div style="position:absolute;right:-5px;top:10px;bottom:10px;width:5px;border-radius:2px;
                background:repeating-linear-gradient(180deg,#fdf9f2 0 2px,#dccdb4 2px 3px)"></div>
    <p class="brush" style="font-size:min(1.9vw,19px);color:#4b3826">我的</p>
    <p style="margin-top:5px;font-size:11px;color:#6d5942">收着 27 封信</p>
    <div style="margin-top:10px;height:1px;width:70%;background:rgba(90,64,52,.18)"></div>
  </a>

  <!-- ═══ 便签（院子）═══ -->
  <a href="#" style="position:absolute;left:38vw;bottom:30vh;width:min(190px,26vw);
      background:#f7efdc;border:1px solid #e4d6b8;padding:16px 18px;transform:rotate(-4.5deg);
      box-shadow:0 18px 40px -26px rgba(90,64,52,.5)">

    <p style="margin-top:5px;font-size:11.5px;color:var(--muted)">今晚有人在这里说了梦</p>
  </a>

  <footer style="position:absolute;left:5vw;right:5vw;bottom:4.6vh;display:flex;
                 align-items:flex-end;font-size:11.5px;color:var(--muted)">
    <nav style="display:flex;gap:15px;border-top:1px solid var(--line);padding-top:13px">
      <a href="#">社区公约</a><a href="#">举报与申诉</a><a href="#">隐私政策</a>
      <a href="#">用户协议</a><a href="#">关于</a>
    </nav>
    <a href="#" style="margin-left:auto;border-top:1px solid var(--line);padding-top:13px">全部条款 →</a>

</html>
