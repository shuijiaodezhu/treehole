<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>概念 E · 空白信纸</title>
<style>
  :root{
    --paper:#f4ebdd; --ink:#3a2f26; --muted:#8a7a68; --line:#ddd0b8;
    --wax:#a8563a; --honey:#d99a4e; --cocoa:#5a4034;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);overflow-x:hidden;
       font-family:"Songti SC","Noto Serif SC",Georgia,serif}
  a{color:inherit;text-decoration:none}
</style>
</head>
<body>

<div style="position:relative;min-height:100vh;padding:16vh 9vw">

  <!-- 折痕：一条很淡的竖线，像纸被折过 -->
  <div style="position:absolute;left:38%;top:0;bottom:0;width:1px;
              background:linear-gradient(180deg,transparent,rgba(90,64,52,.12),transparent)"></div>

  <!-- 正中间偏左，一句极小的话。整页就这一句正文。 -->
  <p style="max-width:20ch;font-size:min(2.1vw,19px);line-height:2.2;color:var(--ink)">
    今天有星星吗。<br>
    我在院子里抬头看了会儿。
  </p>

  <!-- 四行批注：字很小、颜色浅、位置和角度都像是随手写下的 -->
  <a href="#" style="position:absolute;right:7vw;top:24vh;font-size:14.5px;color:#7d6a58;
      transform:rotate(-1.6deg)">小屋 · 11 封未读 <span style="color:var(--wax)">→</span></a>

  <a href="#" style="position:absolute;right:14vw;top:40vh;font-size:13.5px;color:#8a7a68;
      transform:rotate(1.1deg)">院子 · 今晚 3 个人在说梦 <span style="color:var(--wax)">→</span></a>

  <a href="#" style="position:absolute;left:11vw;top:62vh;font-size:14px;color:#7d6a58;
      transform:rotate(-0.8deg)">聚会 · 有人在放一首很旧的歌 <span style="color:var(--wax)">→</span></a>

  <a href="#" style="position:absolute;right:9vw;bottom:14vh;font-size:14.5px;color:#7d6a58;
      transform:rotate(1.4deg)">我的 · 收着 27 封信 <span style="color:var(--wax)">→</span></a>

  <p style="position:absolute;left:9vw;bottom:6vh;font-size:11.5px;color:var(--muted);letter-spacing:.14em">
    10.16 · 徐州 · 陪你走过 3 天
  </p>
  <p style="position:absolute;right:9vw;bottom:6vh;font-size:11.5px;color:var(--muted);letter-spacing:.14em">
    睡觉的猪
  </p>
</div>

</body>
</html>
