name: build-android-apk

# 什么时候构建：
#   · 你手动点（Actions → 这个任务 → Run workflow ✓）
#   · 或者 android/ 里的东西改了自动构建 ✓
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 这个 action 会把 gradle 装好 ✓（所以仓库里不需要 gradle wrapper ✓）
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 有签名 Secrets 时解出 keystore（没有就跳过 → 出 debug 包，不会失败）
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/yourletters.keystore"
          ls -l "$RUNNER_TEMP/yourletters.keystore"

      # 优先出**签名版**（能覆盖安装 ✓ 商店认 ✓）；没有 Secrets 就出 debug 版 ✓
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/yourletters.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then
            echo "==> 用**正式签名**构建 release"
            gradle assembleRelease --no-daemon
          else
            echo "==> 没有签名 Secrets，出 debug 包（功能一样，只是不能覆盖安装）"
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yourletters-apk
          path: |
               android/app/build/outputs/apk/debug/*.apk
               android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 起个好看的名字，方便直接分享（apk 里自带的名字是 app-debug.apk ✓ 太丑 ✗）
      - name: Rename APK
        working-directory: android
        run: |
            if [ -f app/build/outputs/apk/release/app-release.apk ]; then
              cp app/build/outputs/apk/release/app-release.apk yourletters.apk
              echo "==> 用的是签名版 release 包 ✓"
            else
              cp app/build/outputs/apk/debug/app-debug.apk yourletters.apk
              echo "==> 用的是 debug 包（未签名）"
            fi

      # 发布到 Release：得到一个**永久直链** ✓ 朋友点开就能下 ✓ 不用登录 ✓ 不用解压 ✓
      # 标签固定为 apk-latest ✓ 所以链接永远是这个：
      #   https://github.com/shuijiaodezhu/treehole/releases/download/apk-latest/yourletters.apk
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 你的来信 · 安卓安装包（最新）
          body: |
            自动构建的安卓安装包。

            下载下面的 **yourletters.apk** 直接安装即可（不需要解压）。
            装之前如果提示"未知来源/纯净模式"，允许一下就行。
          files: android/yourletters.apk
