<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>概念 F · 杂志封面</title>
<style>
  :root{
    --paper:#f4ebdd; --ink:#3a2f26; --muted:#8a7a68; --line:#ddd0b8;
    --wax:#a8563a; --honey:#d99a4e; --cocoa:#5a4034;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);overflow-x:hidden;
       font-family:"Songti SC","Noto Serif SC",Georgia,serif}
  a{color:inherit;text-decoration:none}
</style>
</head>
<body>

<div style="position:relative;min-height:100vh;overflow:hidden">

  <!-- 报头：一行小字，横贯 -->
  <div style="display:flex;justify-content:space-between;padding:44px 6vw 0;
              font-size:12px;letter-spacing:.16em;color:var(--muted)">
    <span>DEAR YOU</span><span>第 27 期</span><span>10.16 · 徐州</span>
  </div>

  <!-- 巨大标题：故意让左边缘裁掉第一个字的三分之一 -->
  <h1 style="margin:6vh 0 0 -3vw;font-family:'Ma Shan Zheng','Songti SC',serif;
             font-size:min(19vw,240px);line-height:.92;white-space:nowrap">
    你的来信
  </h1>

  <!-- 一句引言压在左下，跟标题咬在一起 -->
  <p style="margin:7vh 0 0 6vw;max-width:26ch;font-size:min(1.9vw,17px);line-height:2;color:#5c4c3e">
    「今天有星星吗。」<br>
    <span style="font-size:12.5px;color:var(--muted)">来自陌生人的问候 · 睡觉的猪</span>
  </p>

  <!-- 封面要目：右侧一列，四条大小不一，各带一条细线 -->
  <div style="position:absolute;right:6vw;top:26vh;width:min(330px,42vw);text-align:right">
    <a href="#" style="display:block;padding:16px 0 14px;border-top:1px solid var(--line)">
      <span style="font-size:min(3.4vw,30px)">小屋</span>
      <span style="display:block;margin-top:6px;font-size:12.5px;color:var(--muted)">未读 11 封</span>
    </a>
    <a href="#" style="display:block;padding:14px 0 12px;border-top:1px solid var(--line)">
      <span style="font-size:min(2.6vw,23px)">院子</span>
      <span style="display:block;margin-top:5px;font-size:12.5px;color:var(--muted)">今晚 3 个人在说梦</span>
    </a>
    <a href="#" style="display:block;padding:13px 0 11px;border-top:1px solid var(--line)">
      <span style="font-size:min(2.1vw,19px)">聚会</span>
      <span style="display:block;margin-top:4px;font-size:12.5px;color:var(--muted)">有人在放一首很旧的歌</span>
    </a>
    <a href="#" style="display:block;padding:12px 0 10px;border-top:1px solid var(--line);
                       border-bottom:1px solid var(--line)">
      <span style="font-size:min(1.8vw,16px)">我的</span>
      <span style="display:block;margin-top:4px;font-size:12.5px;color:var(--muted)">收着 27 封信</span>
    </a>
  </div>

  <!-- 页脚：两行小字，像刊号 -->
  <div style="position:absolute;left:6vw;right:6vw;bottom:5vh;display:flex;
              justify-content:space-between;font-size:11.5px;color:var(--muted);letter-spacing:.12em">
    <span>陪你走过 3 天</span><span>睡觉的猪</span>
  </div>
</div>

</body>
</html>
