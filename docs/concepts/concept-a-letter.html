<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>概念 A · 一页信</title>
<style>
  :root{
    --paper:#f4ebdd; --ink:#3a2f26; --muted:#8a7a68; --line:#ddd0b8;
    --wax:#a8563a; --honey:#d99a4e; --cocoa:#5a4034;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
       font-family:"Songti SC","Noto Serif SC",Georgia,serif;}
  a{color:inherit;text-decoration:none}
</style>
</head>
<body>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 5vw">
  <div style="position:relative;width:min(680px,100%);transform:rotate(-0.55deg)">

    <!-- 右上：邮票 + 邮戳 -->
    <div style="position:absolute;right:6px;top:-38px;width:74px;height:92px;
                background:#fdf8f0;border:1px dashed var(--line);
                display:flex;align-items:center;justify-content:center;
                font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);
                letter-spacing:.1em">80¢</div>
    <div style="position:absolute;right:56px;top:-6px;width:104px;height:104px;
                border:1px solid rgba(168,86,58,.35);border-radius:999px;
                transform:rotate(-11deg);display:flex;align-items:center;justify-content:center;
                font-size:10.5px;color:rgba(168,86,58,.6);text-align:center;line-height:1.5">
      10.16<br>徐州
    </div>

    <!-- 抬头：手写的日期，不居中、不方正 -->
    <p style="font-size:14px;color:var(--muted);letter-spacing:.08em">
      十月十六日，夜里
    </p>

    <p style="margin-top:26px;font-size:19px;line-height:2.15">
      今天有星星吗。我在院子里抬头看了会儿，<br>
      想起你上次说，冬天的星星比夏天锐利。
    </p>

    <!-- 四个地方写成信里的句子：没有卡片、没有图标、没有说明文字 -->
    <div style="margin-top:52px;font-size:18px;line-height:2.5">
      <a href="#" style="border-bottom:1px solid var(--line);padding-bottom:2px">小屋</a>
      <span style="color:var(--muted)">——那几个人还在等你回话，未读 11 封。</span><br>

      <a href="#" style="border-bottom:1px solid var(--line);padding-bottom:2px">院子</a>
      <span style="color:var(--muted)">——今晚有 3 个人在说梦。</span><br>

      <a href="#" style="border-bottom:1px solid var(--line);padding-bottom:2px">聚会</a>
      <span style="color:var(--muted)">——有人在放一首很旧的歌，一起来听。</span><br>

      <a href="#" style="border-bottom:1px solid var(--line);padding-bottom:2px">我的</a>
      <span style="color:var(--muted)">——你收着 27 封信，最近一封在三天前。</span>
    </div>

    <!-- 落款：偏右一点，不是严格右对齐 -->
    <p style="margin-top:64px;font-size:17px;text-align:right;padding-right:34px">
      睡觉的猪
      <span style="display:block;margin-top:6px;font-size:12px;color:var(--muted)">
        —— 写于徐州 · 陪你走过 3 天
      </span>
    </p>
  </div>
</div>

</body>
</html>
