<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>概念 D · 桌面</title>
<style>
  :root{
    --paper:#f4ebdd; --ink:#3a2f26; --muted:#8a7a68; --line:#ddd0b8;
    --wax:#a8563a; --honey:#d99a4e; --cocoa:#5a4034;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);overflow-x:hidden;
       font-family:"Songti SC","Noto Serif SC",Georgia,serif}
  a{color:inherit;text-decoration:none}
</style>
</head>
<body>

<div style="position:relative;min-height:100vh;
     background:linear-gradient(160deg,#efe3d0 0%,#f4ebdd 45%,#efe6d6 100%)">

  <!-- 杯印：一个浅浅的旧痕 -->
  <div style="position:absolute;right:22vw;top:8vh;width:120px;height:120px;border-radius:999px;
              border:9px solid rgba(168,86,58,.07)"></div>

  <!-- 信纸：主内容，歪 3 度，左上被屏幕裁掉一角 -->
  <div style="position:absolute;left:-3vw;top:9vh;width:min(560px,74vw);
              background:#fdf8f0;padding:46px 42px 54px;
              transform:rotate(-3deg);box-shadow:0 30px 70px -34px rgba(90,64,52,.5)">
    <p style="font-size:13px;color:var(--muted);letter-spacing:.1em">十月十六日，夜里</p>
    <p style="margin-top:20px;font-size:min(3.1vw,26px);line-height:1.95">
      今天有星星吗。<br>
      我在院子里抬头看了会儿，想起你上次说，<br>
      冬天的星星比夏天锐利。
    </p>
  </div>

  <!-- 拆开的信封：压在信纸右下，标签写在上面 -->
  <a href="#" style="position:absolute;left:20vw;bottom:8vh;width:min(430px,58vw);
      background:#f7ece0;border:1.5px solid #e2d3bd;padding:34px 30px 30px;
      transform:rotate(6deg);box-shadow:0 26px 60px -32px rgba(90,64,52,.5)">
    <svg viewBox="0 0 100 34" preserveAspectRatio="none"
         style="position:absolute;left:0;right:0;top:0;width:100%;height:34px">
      <path d="M0 0 L50 30 L100 0" fill="none" stroke="#e2d3bd" stroke-width="1.4"/>
    </svg>
    <p style="font-size:min(2.6vw,22px)">小屋</p>
    <p style="margin-top:6px;font-size:13.5px;color:var(--muted)">那几个人还在等你回话 · 未读 11 封</p>
  </a>

  <!-- 照片：右边，白边，被屏幕右缘裁掉一点 -->
  <a href="#" style="position:absolute;right:-4vw;top:16vh;width:min(330px,44vw);
      background:#fff;padding:12px 12px 46px;transform:rotate(4deg);
      box-shadow:0 26px 60px -30px rgba(90,64,52,.45)">
    <div style="height:min(200px,26vw);background:linear-gradient(150deg,#e9dcc8,#d9c7a8)"></div>
    <p style="position:absolute;left:14px;bottom:14px;font-size:14px">院子</p>
    <p style="position:absolute;right:14px;bottom:14px;font-size:12px;color:var(--muted)">今晚 3 个人在说梦</p>
  </a>

  <!-- 票根：很小，歪得多 -->
  <a href="#" style="position:absolute;right:16vw;bottom:14vh;width:min(230px,32vw);
      background:#fbeae3;border:1.5px dashed #e0b9a4;padding:18px 20px;
      transform:rotate(-8deg)">
    <p style="font-size:min(2vw,18px)">聚会</p>
    <p style="margin-top:4px;font-size:12.5px;color:#9c7566">有人在放一首很旧的歌</p>
  </a>

  <!-- 钥匙：最不起眼，藏在右下角 -->
  <a href="#" style="position:absolute;right:6vw;bottom:6vh;display:flex;align-items:center;gap:9px;
      transform:rotate(12deg)">
    <svg width="54" height="22" viewBox="0 0 54 22" fill="none">
      <circle cx="11" cy="11" r="7.5" stroke="#a8907a" stroke-width="1.5"/>
      <path d="M18 11h30M40 11v6M34 11v5" stroke="#a8907a" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span style="font-size:15px">我的 <span style="font-size:12px;color:var(--muted)">· 27 封信</span></span>
  </a>

  <!-- 笔：纯气氛，斜着压在最下面 -->
  <div style="position:absolute;left:44vw;top:52vh;width:220px;height:7px;border-radius:999px;
              background:linear-gradient(90deg,#5a4034,#8a6a4a);transform:rotate(64deg);opacity:.75"></div>
</div>

</body>
</html>
