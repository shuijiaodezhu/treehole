<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>概念 C · 一句</title>
<style>
  :root{
    --paper:#f4ebdd; --ink:#3a2f26; --muted:#8a7a68; --line:#ddd0b8;
    --wax:#a8563a; --honey:#d99a4e; --cocoa:#5a4034;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
       font-family:"Songti SC","Noto Serif SC",Georgia,serif;}
  a{color:inherit;text-decoration:none}
</style>
</head>
<body>

<div style="min-height:100vh;position:relative;padding:14vh 10vw 12vh">

  <!-- 一屏只有一句，巨大；故意放偏，不居中 -->
  <p style="max-width:14ch;font-size:min(7.4vw,92px);line-height:1.28;letter-spacing:.01em">
    今天<br>有星星<br>吗。
  </p>

  <p style="margin-top:9vh;font-size:13px;color:var(--muted);letter-spacing:.1em">
    来自陌生人的问候 · 睡觉的猪
  </p>

  <!-- 四个地方：只写名字，不给说明，不给框，一件一行，行距很大 -->
  <div style="margin-top:16vh;font-size:min(3.2vw,30px);line-height:3.4">
    <a href="#" style="display:block">小屋 <span style="font-size:12px;color:var(--wax)">11</span></a>
    <a href="#" style="display:block">院子</a>
    <a href="#" style="display:block">聚会</a>
    <a href="#" style="display:block">我的</a>
  </div>

  <!-- 角落两行极小的字，像书的页眉页脚 -->
  <p style="position:absolute;left:10vw;bottom:6vh;font-size:11.5px;color:var(--muted);letter-spacing:.14em">
    10.16 · 徐州 · 陪你走过 3 天
  </p>
  <p style="position:absolute;right:10vw;bottom:6vh;font-size:11.5px;color:var(--muted);letter-spacing:.14em">
    往下 →
  </p>
</div>

</body>
</html>
